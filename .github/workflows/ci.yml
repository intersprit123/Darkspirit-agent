name: CI

on:
  push:
    branches: [main, feature/browser-ai-bridge]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Install Node.js for extension syntax checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Python and extension syntax
        run: |
          uv run python -m compileall -q darkspirit_bridge
          node --check browser_extension/background.js
          node --check browser_extension/content.js
          node --check browser_extension/popup.js

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --tb=short
