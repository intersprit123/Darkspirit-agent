name: CI

on:
  push:
    branches: [main, feature/browser-ai-bridge, feature/background-companion]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint new integration files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff==0.12.1

      - name: Lint bridge and bridge tests
        run: ruff check darkspirit_bridge darkspirit_companion tests/unit/test_browser_bridge.py tests/unit/test_background_companion.py

      - name: Check formatting of bridge and bridge tests
        run: ruff format --check darkspirit_bridge tests/unit/test_browser_bridge.py tests/unit/test_background_companion.py

      - name: Validate extension manifest
        run: python -c "import json; json.load(open('browser_extension/manifest.json', encoding='utf-8'))"

      - name: Check extension JavaScript syntax
        run: |
          node --check browser_extension/background.js
          node --check browser_extension/content.js
          node --check browser_extension/popup.js

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra companion

      - name: Run unit tests
        run: |
          uv run python -m compileall -q darkspirit_companion darkspirit_bridge
          uv run pytest tests/unit/ -v --tb=short
